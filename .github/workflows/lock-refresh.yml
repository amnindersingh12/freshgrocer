name: lock-refresh (temporary)
on:
  push:
    branches: [chore/maintenance]
    paths: [Gemfile, .github/workflows/lock-refresh.yml]
permissions:
  contents: write
jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - name: Re-resolve Gemfile.lock
        run: |
          bundle config set frozen false
          bundle lock --update rails devise webdrivers selenium-webdriver minitest --add-platform x86_64-linux 2>&1 | tail -20
          bundle lock --print > /dev/null
      - name: Commit lockfile
        run: |
          git config user.name "amnindersingh12"
          git config user.email "amnindersingh58611@gmail.com"
          git add Gemfile.lock
          git commit -m "chore: regenerate Gemfile.lock for Rails 8.0" || echo "nothing to commit"
          git push
